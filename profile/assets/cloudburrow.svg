<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="CloudBurrow — local Google Cloud development and integration testing"><title>CloudBurrow — local Google Cloud development and integration testing</title><rect width="1200" height="260" rx="24" fill="#0e1537"/><text x="44" y="49" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#a8c4fa">OPEN SOURCE / DEVELOPER TOOLS</text><text x="44" y="106" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#fff">CloudBurrow</text><text x="44" y="151" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#a8c4fa">Google Cloud APIs. Local development.</text><text x="44" y="193" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#fbfbf9">Build locally. Test in CI. Check compatibility by operation.</text><rect x="795" y="40" width="360" height="180" rx="12" fill="#090d20" stroke="#24316b"/><circle cx="820" cy="62" r="4" fill="#7aae88"/><circle cx="839" cy="62" r="4" fill="#a8c4fa"/><circle cx="858" cy="62" r="4" fill="#3d7df2"/><text x="817" y="108" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#7aae88">$ cloudburrow up</text><text x="817" y="151" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a8c4fa">Kubernetes + official SDKs</text><text x="817" y="185" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#fbfbf9">Your cloud workflow. Local.</text></svg>